# https://circleci.com/docs/2.0/configuration-reference/
#
# Tests run in GitHub Actions (.github/workflows/ci.yml).
# CircleCI only publishes the plugin to NPM, since that uses the org-npm-credentials context.
version: 2.1

jobs:
  publish:
    description: Publishes the new version of the plugin to NPM
    docker:
      - image: cimg/node:22.14.0
    environment:
      # we don't need Cypress to do the release
      CYPRESS_INSTALL_BINARY: '0'
      # trick semantic-release into thinking this is NOT a pull request
      # (under the hood the module env-ci is used to check if this is a PR)
      CIRCLE_PR_NUMBER: ''
      CIRCLE_PULL_REQUEST: ''
      CI_PULL_REQUEST: ''
    steps:
      - checkout
      - run: npm ci
      - run: npm run build
      - run: npm run semantic-release

workflows:
  release:
    jobs:
      - publish:
          context: org-npm-credentials
          filters:
            branches:
              only:
                - master
                - beta
                - next
                - dev
