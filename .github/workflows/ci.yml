name: CI

on:
  push:
    branches:
      - master
      - beta
      - next
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Code style check 🧹
        run: npm run format:check
      - name: Markdown link check
        run: npm run check:markdown

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-coverage
          path: coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  verify-test-apps:
    name: Test app (${{ matrix.app }})
    needs: [lint, unit-test, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - all-files
          - backend
          - batch-send-coverage
          - before-all-visit
          - before-each-visit
          - component-vite
          - esm-example
          - exclude-files
          - frontend
          - fullstack
          - multiple-backends
          - one-spec
          - same-folder
          - support-files
          - ts-example
          - unit-tests-js
          - use-webpack
          - redirect
    defaults:
      run:
        working-directory: test-apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Build project
        # test apps load the plugin from dist/ through "@cypress/code-coverage": "file:."
        run: npm run build
        working-directory: .
      - name: Install test app dependencies
        run: npm i
      - name: Run Cypress tests
        run: npm run test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.app }}
          path: test-apps/${{ matrix.app }}/coverage
          if-no-files-found: ignore
      - name: Verify Code Coverage
        run: npm run coverage:verify
      - name: Check code coverage files 📈
        # files at 0% still appear in the report, so the percentage alone
        # can't tell whether an unexpected file slipped in
        run: npm run coverage:check-files

  windows-test:
    name: Test app (all-files, Windows)
    needs: [lint, unit-test, build]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin the Cypress cache folder
        # the action runs Cypress through cmd.exe while the other steps use Git Bash,
        # so one explicit folder makes sure both look for the binary in the same place
        run: echo "CYPRESS_CACHE_FOLDER=$RUNNER_TEMP\\cypress-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\cypress-cache
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install deps for code coverage
        run: npm ci
      - name: Install and verify the Cypress binary
        run: npx cypress install && npx cypress verify
      - name: Build project
        run: npm run build
      - name: Install test app deps
        run: npm i
        working-directory: test-apps/all-files
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run start:windows --prefix test-apps/all-files
          command: npx cypress run --project test-apps/all-files
      - name: Verify Code Coverage
        run: npm run coverage:verify
        working-directory: test-apps/all-files
      - name: Check code coverage files 📈
        run: npm i -D check-code-coverage && npm run coverage:check-files
        working-directory: test-apps/all-files

  release:
    name: Release
    needs: [verify-test-apps, windows-test]
    if: github.event_name == 'push' && contains(fromJSON('["master", "next", "beta", "dev"]'), github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm trusted publishing and provenance
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          # semantic-release reads the full history and tags to work out the next version
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # npm trusted publishing needs npm 11.5.1 or later, which ships with Node 24
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to npm 🚀
        run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
